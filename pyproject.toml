[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbot"
version = "0.1.0"
description = "AI pull request reviewer: a GitHub App and CLI that leaves inline review comments, powered by Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
reviewbot = "reviewbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned so results don't change when CI picks up a newer ruff with different defaults.
select = ["E4", "E7", "E9", "F", "UP", "C4"]
