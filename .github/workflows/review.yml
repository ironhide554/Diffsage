name: AI review

# Diffsage reviews its own pull requests with the action defined in this repo.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets and a read-only token, so skip them; drafts are skipped too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Note missing secret
        if: env.HAS_GEMINI_KEY != 'true'
        run: echo "::notice::GEMINI_API_KEY secret is not set; skipping AI review."
      - uses: actions/checkout@v4
        if: env.HAS_GEMINI_KEY == 'true'
      - uses: ./
        if: env.HAS_GEMINI_KEY == 'true'
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
